<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GOSPLAN13 | JANコード変換・ラベル作成ツール</title>
    <meta name="description" content="商品名、商品画像、JANコードから、印刷可能なJANラベルを作成するシンプルなWebツールです。">
    <meta name="theme-color" content="#ffffff">
    <meta property="og:locale" content="ja_JP">
    <meta property="og:type" content="website">
    <meta property="og:title" content="GOSPLAN13 | JANコード変換・ラベル作成ツール">
    <meta property="og:description" content="商品名、商品画像、JANコードから、印刷可能なJANラベルを作成するシンプルなWebツールです。">
    <link rel="stylesheet" href="../css/ress.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/button.css">
    <link rel="stylesheet" href="../css/toggle.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/main_with_image.css">
    <link rel="stylesheet" href="./css/print.css" media="print">
    <script src="../dist/site-header.js" type="module"></script>
    <script src="./dist/main.js" type="module"></script>
</head>

<body>

    <!-- =====================================================
         集中表示時に折りたたむ上部パネル
         ===================================================== -->

    <div class="top-panel">
        <div class="top-panel__content">

            <!-- =================================================
                 ヘッダー
                 ================================================= -->

            <site-header></site-header>


            <!-- =================================================
                 リボン
                 ================================================= -->

            <section class="ribbon">
                <div class="ribbon__item">

                    <!-- =========================================
                         基本操作
                         ========================================= -->

                    <div class="base-options">
                        <button id="preview-focus-button" type="button"
                            class="glass-button glass-button--icon glass-button--with-tooltip" aria-label="プレビューだけを表示"
                            aria-pressed="false">
                            <svg xmlns="http://www.w3.org/2000/svg" class="glass-button__icon" viewBox="0 -960 960 960"
                                aria-hidden="true">
                                <path
                                    d="M120-120v-240h80v104l144-144 56 56-144 144h104v80H120Zm480 0v-80h104L560-344l56-56 144 144v-104h80v240H600ZM344-560 200-704v104h-80v-240h240v80H256l144 144-56 56Zm272 0-56-56 144-144H600v-80h240v240h-80v-104L616-560Z" />
                            </svg>

                            <span class="glass-button__tooltip" role="tooltip">
                                プレビューだけを表示
                            </span>
                        </button>

                        <button id="json-import-button" type="button" class="glass-button">
                            <svg xmlns="http://www.w3.org/2000/svg" class="glass-button__icon" height="24px"
                                width="24px" viewBox="0 -960 960 960" aria-hidden="true">
                                <path d="m560-120-57-57 144-143H200v-480h80v400h367L503-544l56-57 241 241-240 240Z" />
                            </svg>

                            JSONインポート
                        </button>

                        <button id="json-export-button" type="button" class="glass-button">
                            <svg xmlns="http://www.w3.org/2000/svg" class="glass-button__icon" height="24px"
                                width="24px" viewBox="0 -960 960 960" aria-hidden="true">
                                <path
                                    d="m720-120 160-160-56-56-64 64v-167h-80v167l-64-64-56 56 160 160ZM560 0v-80h320V0H560ZM240-160q-33 0-56.5-23.5T160-240v-560q0-33 23.5-56.5T240-880h280l240 240v121h-80v-81H480v-200H240v560h240v80H240Zm0-80v-560 560Z" />
                            </svg>
                            JSON出力
                        </button>

                        <button id="clear-all-button" type="button" class="glass-button">
                            <svg xmlns="http://www.w3.org/2000/svg" class="glass-button__icon" height="24px"
                                width="24px" viewBox="0 -960 960 960" aria-hidden="true">
                                <path
                                    d="M440-122q-121-15-200.5-105.5T160-440q0-66 26-126.5T260-672l57 57q-38 34-57.5 79T240-440q0 88 56 155.5T440-202v80Zm80 0v-80q87-16 143.5-83T720-440q0-100-70-170t-170-70h-3l44 44-56 56-140-140 140-140 56 56-44 44h3q134 0 227 93t93 227q0 121-79.5 211.5T520-122Z" />
                            </svg>
                            すべてクリア
                        </button>
                    </div>


                    <!-- =========================================
                         表示設定・複製
                         ========================================= -->

                    <div class="ribbon__option">
                        <input id="image-mode-toggle" class="ribbon__option-input" type="checkbox">

                        <label class="ribbon__option-label" for="image-mode-toggle">
                            画像あり
                        </label>

                        <div class="ribbon__copy-menu">
                            <button id="copy-menu-button" type="button" class="glass-button" aria-expanded="false"
                                aria-controls="copy-menu" aria-haspopup="menu">
                                複製
                            </button>

                            <div id="copy-menu" class="ribbon__menu" role="menu" hidden>
                                <button id="duplicate-all-button" type="button">
                                    左上を全体へ複製
                                </button>

                                <button id="duplicate-row-button" type="button">
                                    1行目を下へ複製
                                </button>
                            </div>
                        </div>
                    </div>
                </div>


                <!-- =============================================
                     印刷操作
                     ============================================= -->

                <div class="ribbon__far-item">
                    <button id="print-button" type="button" class="glass-button glass-button--primary">
                        <svg xmlns="http://www.w3.org/2000/svg" class="glass-button__icon" height="24px" width="24px"
                            viewBox="0 -960 960 960" aria-hidden="true">
                            <path
                                d="M640-640v-120H320v120h-80v-200h480v200h-80Zm-480 80h640-640Zm560 100q17 0 28.5-11.5T760-500q0-17-11.5-28.5T720-540q-17 0-28.5 11.5T680-500q0 17 11.5 28.5T720-460Zm-80 260v-160H320v160h320Zm80 80H240v-160H80v-240q0-51 35-85.5t85-34.5h560q51 0 85.5 34.5T880-520v240H720v160Zm80-240v-160q0-17-11.5-28.5T760-560H200q-17 0-28.5 11.5T160-520v160h80v-80h480v80h80Z" />
                        </svg>

                        印刷・PDF
                    </button>
                </div>
            </section>

        </div>
    </div>


    <!-- =====================================================
         A4プレビュー
         ===================================================== -->

    <main class="main">
        <div id="a4-preview" class="a4-preview a4-preview--with-images" aria-label="A4ラベルプレビュー"></div>


        <!-- =================================================
             商品ラベルテンプレート
             ================================================= -->

        <template id="product-label-template">
            <article class="product-label">

                <!-- 商品名 -->

                <div class="product-label__name-area">
                    <input class="product-label__name-input" type="text" autocomplete="off" placeholder="商品名を入力"
                        aria-label="商品名">
                </div>


                <!-- 商品画像 -->

                <div class="product-label__image-area">
                    <label class="product-label__image-picker">
                        <input class="product-label__image-input" type="file"
                            accept="image/png,image/jpeg,image/webp,image/gif" aria-label="商品画像を選択">

                        <img class="product-label__image-preview" alt="" hidden>

                        <span class="product-label__image-placeholder">
                            <!--
                            <svg
                                class="product-label__image-icon"
                                viewBox="0 -960 960 960"
                                aria-hidden="true"
                            >
                                <path d="ここに実際のSVGパス"></path>
                            </svg>
                            -->

                            <span>
                                商品画像を選択
                            </span>
                        </span>
                    </label>
                </div>


                <!-- バーコード -->

                <div class="product-label__barcode-area" aria-label="JANバーコード表示領域">
                    <svg class="product-label__barcode" role="img" aria-label="JANバーコード"
                        preserveAspectRatio="xMidYMid meet"></svg>

                    <span class="product-label__barcode-placeholder">
                        ここにJANが表示されます
                    </span>
                </div>


                <!-- JAN入力 -->

                <div class="product-label__jan-area">
                    <input class="product-label__jan-input" type="text" inputmode="numeric" maxlength="14"
                        autocomplete="off" placeholder="12桁または13桁" aria-label="JANコード">
                </div>

            </article>
        </template>
    </main>


    <!-- =====================================================
         フッター
         ===================================================== -->

    <footer class="footer">
        <small>
            Copyright © 2026 Morbee. All Rights Reserved.
        </small>
    </footer>


    <!-- =====================================================
         集中表示解除ボタン
         top-panelの外側に置く
         ===================================================== -->

    <button id="preview-focus-exit-button" type="button"
        class="glass-button glass-button--icon glass-button--with-tooltip preview-focus-exit-button"
        aria-label="通常表示に戻す" aria-pressed="false">
        <svg class="glass-button__icon" viewBox="0 -960 960 960" aria-hidden="true">
            <path
                d="M240-120v-104L96-80l-56-56 144-144H80v-80h240v240h-80Zm400 0v-240h240v80H776l144 144-56 56-144-144v104h-80ZM184-600 40-744l56-56 144 144v-104h80v240H80v-80h104Zm536 80v-240h80v104l144-144 56 56-144 144h104v80H720Z" />
        </svg>

        <span class="glass-button__tooltip glass-button__tooltip--right" role="tooltip">
            通常表示に戻す
        </span>
    </button>
    <button id="preview-focus-print-button" type="button"
        class="glass-button glass-button--primary preview-focus-print-button" aria-label="印刷またはPDF保存">
        <svg xmlns="http://www.w3.org/2000/svg" class="glass-button__icon" viewBox="0 -960 960 960" aria-hidden="true">
            <path
                d="M640-640v-120H320v120h-80v-200h480v200h-80Zm-480 80h640-640Zm560 100q17 0 28.5-11.5T760-500q0-17-11.5-28.5T720-540q-17 0-28.5 11.5T680-500q0 17 11.5 28.5T720-460Zm-80 260v-160H320v160h320Zm80 80H240v-160H80v-240q0-51 35-85.5t85-34.5h560q51 0 85.5 34.5T880-520v240H720v160Zm80-240v-160q0-17-11.5-28.5T760-560H200q-17 0-28.5 11.5T160-520v160h80v-80h480v80h80Z" />
        </svg>

        印刷・PDF
    </button>
    <dialog id="app-modal" class="app-modal" aria-labelledby="app-modal-title" aria-describedby="app-modal-description">
        <div class="app-modal__panel">
            <header class="app-modal__header">
                <div class="app-modal__heading">
                    <p id="app-modal-eyebrow" class="app-modal__eyebrow" hidden></p>

                    <h2 id="app-modal-title" class="app-modal__title"></h2>

                    <p id="app-modal-description" class="app-modal__description" hidden></p>
                </div>

                <button id="app-modal-close-button" type="button" class="app-modal__close-button" aria-label="モーダルを閉じる">
                    <svg class="app-modal__close-icon" viewBox="0 -960 960 960" aria-hidden="true">
                        <path
                            d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z" />
                    </svg>
                </button>
            </header>

            <div id="app-modal-body" class="app-modal__body"></div>

            <footer id="app-modal-footer" class="app-modal__footer" hidden></footer>
        </div>
    </dialog>
</body>

</html>
